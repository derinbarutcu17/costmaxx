name: Bug Report
description: Report a bug in CostMax
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please run `costmaxx doctor` and paste the output below.
        Issues that are not reproducible from a clean setup will be closed.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
      default: 0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `costmaxx --version`
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal command or scenario that triggers the bug
      placeholder: |
        1. costmaxx install
        2. Run costmax_run with ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I ran `costmaxx doctor` and it passes
          required: true
        - label: I am on the latest release
          required: true
