name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Format check
        run: |
          out=$(gofmt -l internal tests cmd)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -buildvcs=false -count=1 ./...
      - name: Build
        run: go build -buildvcs=false -o /tmp/costmaxx ./cmd/costmax/
      - name: Evaluator self-test
        run: python3 scripts/run-codex-eval.py --self-test && python3 scripts/run-codex-eval.py --fixture-smoke
