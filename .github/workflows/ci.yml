name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Format check
        run: |
          out=$(gofmt -l internal tests cmd)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -buildvcs=false -count=1 ./...
      - name: Evaluator self-test
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          python3 scripts/run-codex-eval.py --self-test && python3 scripts/run-codex-eval.py --fixture-smoke
      - name: Validate release config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2
          args: check

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Cross-compile
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -buildvcs=false -o /tmp/costmaxx ./cmd/costmax/
          file /tmp/costmaxx || true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - uses: github/codeql-action/analyze@v4
