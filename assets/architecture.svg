<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f3f46"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#0a0a0b"/>

  <text x="28" y="30" font-size="16" font-weight="700" fill="#f4f4f5">One costmax_run call, end to end</text>
  <text x="28" y="48" font-size="11" fill="#71717a">model gets a compact summary · full raw output stays local and retrievable</text>

  <g font-size="10" fill="#71717a">
    <text x="32" y="80">1</text><text x="32" y="184">2</text><text x="32" y="288">3</text><text x="32" y="392">4</text><text x="32" y="494">5</text>
  </g>

  <!-- arrows -->
  <line x1="430" y1="106" x2="430" y2="138" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="210" x2="430" y2="242" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="314" x2="430" y2="346" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="418" x2="430" y2="450" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="522" x2="430" y2="554" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="278" x2="714" y2="298" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrd)"/>
  <line x1="714" y1="368" x2="714" y2="396" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrd)"/>

  <!-- 1 -->
  <rect x="310" y="50" width="240" height="56" rx="6" fill="#131316" stroke="#26262a" stroke-width="1"/>
  <text x="430" y="74" font-size="13" font-weight="600" fill="#f4f4f5" text-anchor="middle">Codex CLI</text>
  <text x="430" y="92" font-size="9.5" fill="#71717a" text-anchor="middle">chooses costmax_run when output is large</text>

  <!-- 2 -->
  <rect x="290" y="138" width="280" height="72" rx="6" fill="#131316" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="430" y="164" font-size="13" font-weight="600" fill="#22d3ee" text-anchor="middle">costmax_run (MCP tool)</text>
  <text x="430" y="182" font-size="9.5" fill="#71717a" text-anchor="middle">stdio JSON-RPC · opt-in · executes with your permissions</text>
  <text x="430" y="196" font-size="9.5" fill="#71717a" text-anchor="middle">not a sandbox, not an allowlist</text>

  <!-- 3 -->
  <rect x="290" y="242" width="280" height="72" rx="6" fill="#131316" stroke="#26262a" stroke-width="1"/>
  <text x="430" y="268" font-size="13" font-weight="600" fill="#f4f4f5" text-anchor="middle">execute: sh -c "go test ./..."</text>
  <text x="430" y="286" font-size="9.5" fill="#71717a" text-anchor="middle">stdout + stderr preserved (CombinedOutput)</text>
  <text x="430" y="300" font-size="9.5" fill="#71717a" text-anchor="middle">secrets redacted before anything is stored</text>

  <!-- 4 -->
  <rect x="260" y="346" width="340" height="72" rx="6" fill="#131316" stroke="#26262a" stroke-width="1"/>
  <text x="430" y="372" font-size="13" font-weight="600" fill="#f4f4f5" text-anchor="middle">classify -&gt; deterministic reducer</text>
  <text x="430" y="390" font-size="9.5" fill="#71717a" text-anchor="middle">test · build · diff · search · lint · json · terminal</text>
  <text x="430" y="404" font-size="9.5" fill="#71717a" text-anchor="middle">pure regex, byte-identical on repeat runs</text>

  <!-- 5 -->
  <rect x="260" y="450" width="340" height="72" rx="6" fill="#131316" stroke="#26262a" stroke-width="1"/>
  <text x="430" y="476" font-size="13" font-weight="600" fill="#f4f4f5" text-anchor="middle">policy + post-render guard</text>
  <text x="430" y="494" font-size="9.5" fill="#71717a" text-anchor="middle">reduce · passthrough · artifact_required</text>
  <text x="430" y="508" font-size="9.5" fill="#71717a" text-anchor="middle">never claims a saving the rendered response does not deliver</text>

  <!-- output -->
  <rect x="320" y="554" width="220" height="26" rx="6" fill="#131316" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="430" y="570" font-size="10.5" fill="#22d3ee" text-anchor="middle">compact summary + cmx://artifact/&lt;id&gt; -&gt; model</text>

  <!-- artifact store -->
  <rect x="714" y="252" width="204" height="116" rx="6" fill="#131316" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="816" y="278" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">artifact store</text>
  <text x="816" y="298" font-size="9.5" fill="#71717a" text-anchor="middle">zstd · content-addressed (SHA-256)</text>
  <text x="816" y="314" font-size="9.5" fill="#71717a" text-anchor="middle">byte-for-byte retrieval</text>
  <text x="816" y="330" font-size="9.5" fill="#71717a" text-anchor="middle">deduplicated by digest</text>
  <text x="816" y="350" font-size="9.5" fill="#71717a" text-anchor="middle">raw evidence (redacted)</text>

  <rect x="714" y="396" width="204" height="64" rx="6" fill="#131316" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="816" y="422" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">SQLite</text>
  <text x="816" y="440" font-size="9.5" fill="#71717a" text-anchor="middle">artifact metadata · reduction records</text>
  <text x="816" y="454" font-size="9.5" fill="#71717a" text-anchor="middle">session metrics · task state</text>

  <!-- hooks -->
  <rect x="714" y="50" width="204" height="64" rx="6" fill="#131316" stroke="#26262a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="816" y="74" font-size="11.5" font-weight="600" fill="#a1a1aa" text-anchor="middle">Codex hooks: observe-only</text>
  <text x="816" y="92" font-size="9.5" fill="#71717a" text-anchor="middle">never substitutes tool output</text>
  <text x="816" y="104" font-size="9.5" fill="#71717a" text-anchor="middle">only SessionStart injects context</text>
  <line x1="550" y1="78" x2="710" y2="78" stroke="#3f3f46" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arr)"/>
</svg>
