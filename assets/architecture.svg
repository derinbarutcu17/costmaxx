<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#71717a"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="960" height="660" fill="#0a0a0b"/>

  <text x="48" y="54" font-size="20" font-weight="700" fill="#f4f4f5">One costmax_run call, end to end</text>
  <text x="48" y="76" font-size="11" fill="#71717a">model gets a compact summary · full raw output stays local and retrievable</text>

  <g fill="#71717a" font-size="10">
    <text x="218" y="126">1</text><text x="198" y="222">2</text><text x="198" y="320">3</text><text x="173" y="418">4</text><text x="173" y="516">5</text>
  </g>

  <g stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow-gray)">
    <line x1="440" y1="158" x2="440" y2="190"/>
    <line x1="440" y1="272" x2="440" y2="288"/>
    <line x1="440" y1="370" x2="440" y2="386"/>
    <line x1="440" y1="468" x2="440" y2="484"/>
    <line x1="440" y1="566" x2="440" y2="575"/>
  </g>

  <rect x="290" y="94" width="300" height="64" rx="7" fill="#131316" stroke="#26262a"/>
  <text x="440" y="120" font-size="14" font-weight="600" fill="#f4f4f5" text-anchor="middle">Codex CLI</text>
  <text x="440" y="140" font-size="9.5" fill="#71717a" text-anchor="middle">chooses costmax_run when output is large</text>

  <rect x="250" y="190" width="380" height="82" rx="7" fill="#131316" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="440" y="218" font-size="14" font-weight="600" fill="#22d3ee" text-anchor="middle">costmax_run (MCP tool)</text>
  <text x="440" y="239" font-size="9.5" fill="#71717a" text-anchor="middle">stdio JSON-RPC · opt-in · executes with your permissions</text>
  <text x="440" y="254" font-size="9.5" fill="#71717a" text-anchor="middle">not a sandbox, not an allowlist</text>

  <rect x="250" y="288" width="380" height="82" rx="7" fill="#131316" stroke="#26262a"/>
  <text x="440" y="316" font-size="14" font-weight="600" fill="#f4f4f5" text-anchor="middle">execute: sh -c &quot;go test ./...&quot;</text>
  <text x="440" y="337" font-size="9.5" fill="#71717a" text-anchor="middle">stdout + stderr preserved (CombinedOutput)</text>
  <text x="440" y="352" font-size="9.5" fill="#71717a" text-anchor="middle">secrets redacted before anything is stored</text>

  <rect x="220" y="386" width="440" height="82" rx="7" fill="#131316" stroke="#26262a"/>
  <text x="440" y="414" font-size="14" font-weight="600" fill="#f4f4f5" text-anchor="middle">classify -&gt; deterministic reducer</text>
  <text x="440" y="435" font-size="9.5" fill="#71717a" text-anchor="middle">test · build · diff · search · lint · json · terminal</text>
  <text x="440" y="450" font-size="9.5" fill="#71717a" text-anchor="middle">pure regex, byte-identical on repeat runs</text>

  <rect x="220" y="484" width="440" height="82" rx="7" fill="#131316" stroke="#26262a"/>
  <text x="440" y="512" font-size="14" font-weight="600" fill="#f4f4f5" text-anchor="middle">policy + post-render guard</text>
  <text x="440" y="533" font-size="9.5" fill="#71717a" text-anchor="middle">reduce · passthrough · artifact_required</text>
  <text x="440" y="548" font-size="9.5" fill="#71717a" text-anchor="middle">never claims a saving the rendered response does not deliver</text>

  <rect x="260" y="575" width="360" height="28" rx="7" fill="#131316" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="440" y="594" font-size="10.5" fill="#22d3ee" text-anchor="middle">compact summary + cmx://artifact/&lt;id&gt; -&gt; model</text>

  <rect x="700" y="94" width="220" height="66" rx="7" fill="#131316" stroke="#26262a" stroke-dasharray="4 4"/>
  <text x="810" y="120" font-size="11.5" font-weight="600" fill="#a1a1aa" text-anchor="middle">Codex hooks: observe-only</text>
  <text x="810" y="140" font-size="9.5" fill="#71717a" text-anchor="middle">never substitutes tool output</text>
  <text x="810" y="154" font-size="9.5" fill="#71717a" text-anchor="middle">only SessionStart injects context</text>
  <line x1="590" y1="126" x2="696" y2="126" stroke="#71717a" stroke-dasharray="4 4" marker-end="url(#arrow-gray)"/>

  <rect x="700" y="280" width="220" height="116" rx="7" fill="#131316" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="810" y="308" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">artifact store</text>
  <text x="810" y="329" font-size="9" fill="#71717a" text-anchor="middle">zstd · content-addressed (SHA-256)</text>
  <text x="810" y="345" font-size="9.5" fill="#71717a" text-anchor="middle">byte-for-byte retrieval</text>
  <text x="810" y="361" font-size="9.5" fill="#71717a" text-anchor="middle">deduplicated by digest</text>
  <text x="810" y="377" font-size="9.5" fill="#71717a" text-anchor="middle">raw evidence (redacted)</text>

  <rect x="700" y="428" width="220" height="72" rx="7" fill="#131316" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="810" y="456" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">SQLite</text>
  <text x="810" y="477" font-size="9.5" fill="#71717a" text-anchor="middle">artifact metadata · reduction records</text>
  <text x="810" y="493" font-size="9.5" fill="#71717a" text-anchor="middle">session metrics · task state</text>
  <line x1="610" y1="329" x2="696" y2="329" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-violet)"/>
  <line x1="810" y1="396" x2="810" y2="428" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-violet)"/>
</svg>
