<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#020617"/>
  <rect width="960" height="600" fill="url(#grid)"/>

  <text x="28" y="32" font-size="16" font-weight="700" fill="#e2e8f0">One costmax_run call, end to end</text>
  <text x="28" y="50" font-size="11" fill="#94a3b8">model gets a compact summary · full raw output stays local and retrievable</text>

  <!-- arrows behind boxes -->
  <line x1="430" y1="102" x2="430" y2="142" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="206" x2="430" y2="242" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="314" x2="430" y2="352" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="416" x2="430" y2="452" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="514" x2="430" y2="532" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- artifact channel -->
  <line x1="570" y1="280" x2="716" y2="300" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrd)"/>
  <line x1="716" y1="370" x2="716" y2="398" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrd)"/>

  <!-- stage numbers -->
  <g font-size="10" fill="#94a3b8">
    <circle cx="56" cy="74" r="11" fill="#0f172a" stroke="#334155"/><text x="56" y="78" text-anchor="middle" fill="#e2e8f0">1</text>
    <circle cx="56" cy="178" r="11" fill="#0f172a" stroke="#334155"/><text x="56" y="182" text-anchor="middle" fill="#e2e8f0">2</text>
    <circle cx="56" cy="282" r="11" fill="#0f172a" stroke="#334155"/><text x="56" y="286" text-anchor="middle" fill="#e2e8f0">3</text>
    <circle cx="56" cy="386" r="11" fill="#0f172a" stroke="#334155"/><text x="56" y="390" text-anchor="middle" fill="#e2e8f0">4</text>
    <circle cx="56" cy="488" r="11" fill="#0f172a" stroke="#334155"/><text x="56" y="492" text-anchor="middle" fill="#e2e8f0">5</text>
  </g>

  <!-- 1: Codex -->
  <rect x="310" y="46" width="240" height="56" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="310" y="46" width="240" height="56" rx="6" fill="#1e293b" opacity="0.5"/>
  <text x="430" y="70" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="600">Codex CLI</text>
  <text x="430" y="88" font-size="9.5" fill="#94a3b8" text-anchor="middle">chooses costmax_run when output is large</text>

  <!-- 2: MCP tool -->
  <rect x="290" y="142" width="280" height="64" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="290" y="142" width="280" height="64" rx="6" fill="rgba(8, 51, 68, 0.45)"/>
  <text x="430" y="168" font-size="13" fill="#22d3ee" text-anchor="middle" font-weight="600">costmax_run (MCP tool)</text>
  <text x="430" y="185" font-size="9.5" fill="#94a3b8" text-anchor="middle">stdio JSON-RPC · opt-in · executes with your permissions</text>
  <text x="430" y="198" font-size="9.5" fill="#64748b" text-anchor="middle">not a sandbox, not an allowlist</text>

  <!-- 3: execute -->
  <rect x="290" y="242" width="280" height="72" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <rect x="290" y="242" width="280" height="72" rx="6" fill="rgba(6, 78, 59, 0.4)"/>
  <text x="430" y="268" font-size="13" fill="#34d399" text-anchor="middle" font-weight="600">execute: sh -c "go test ./..."</text>
  <text x="430" y="285" font-size="9.5" fill="#94a3b8" text-anchor="middle">stdout + stderr preserved (CombinedOutput)</text>
  <text x="430" y="298" font-size="9.5" fill="#94a3b8" text-anchor="middle">secrets redacted before anything is stored</text>

  <!-- 4: classify + reduce -->
  <rect x="260" y="352" width="340" height="64" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="260" y="352" width="340" height="64" rx="6" fill="rgba(76, 29, 149, 0.35)"/>
  <text x="430" y="378" font-size="13" fill="#a78bfa" text-anchor="middle" font-weight="600">classify → deterministic reducer</text>
  <text x="430" y="395" font-size="9.5" fill="#94a3b8" text-anchor="middle">test · build · diff · search · lint · json · terminal · generic</text>
  <text x="430" y="408" font-size="9.5" fill="#64748b" text-anchor="middle">pure regex, byte-identical on repeat runs</text>

  <!-- 5: policy + guard -->
  <rect x="260" y="452" width="340" height="62" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="260" y="452" width="340" height="62" rx="6" fill="rgba(120, 53, 15, 0.3)"/>
  <text x="430" y="478" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="600">policy + post-render guard</text>
  <text x="430" y="495" font-size="9.5" fill="#94a3b8" text-anchor="middle">reduce · passthrough · artifact_required</text>
  <text x="430" y="508" font-size="9.5" fill="#64748b" text-anchor="middle">never claims a saving the rendered response does not deliver</text>

  <!-- 6: model output -->
  <rect x="320" y="532" width="220" height="22" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <text x="430" y="546" font-size="10.5" fill="#34d399" text-anchor="middle">compact summary + cmx://artifact/&lt;id&gt; → model</text>

  <!-- artifact store -->
  <rect x="716" y="252" width="200" height="118" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="716" y="252" width="200" height="118" rx="6" fill="rgba(76, 29, 149, 0.3)"/>
  <text x="816" y="276" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="600">artifact store</text>
  <text x="816" y="295" font-size="9.5" fill="#94a3b8" text-anchor="middle">zstd-compressed</text>
  <text x="816" y="310" font-size="9.5" fill="#94a3b8" text-anchor="middle">content-addressed (SHA-256)</text>
  <text x="816" y="325" font-size="9.5" fill="#94a3b8" text-anchor="middle">byte-for-byte retrieval</text>
  <text x="816" y="340" font-size="9.5" fill="#94a3b8" text-anchor="middle">deduplicated by digest</text>
  <text x="816" y="358" font-size="9.5" fill="#64748b" text-anchor="middle">raw evidence (redacted)</text>

  <rect x="716" y="398" width="200" height="72" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="716" y="398" width="200" height="72" rx="6" fill="rgba(76, 29, 149, 0.3)"/>
  <text x="816" y="424" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="600">SQLite</text>
  <text x="816" y="441" font-size="9.5" fill="#94a3b8" text-anchor="middle">artifact metadata · reduction records</text>
  <text x="816" y="456" font-size="9.5" fill="#94a3b8" text-anchor="middle">session metrics · task state</text>

  <!-- hooks observe-only -->
  <rect x="716" y="46" width="200" height="56" rx="6" fill="#0f172a" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="816" y="68" font-size="11.5" fill="#fb7185" text-anchor="middle" font-weight="600">Codex hooks: observe-only</text>
  <text x="816" y="84" font-size="9.5" fill="#94a3b8" text-anchor="middle">never substitutes tool output</text>
  <text x="816" y="96" font-size="9.5" fill="#64748b" text-anchor="middle">only SessionStart injects context</text>
  <line x1="550" y1="74" x2="712" y2="74" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arr)"/>

  <!-- legend -->
  <g font-size="9.5" fill="#94a3b8">
    <rect x="28" y="578" width="10" height="10" rx="2" fill="#22d3ee"/><text x="44" y="587">MCP surface</text>
    <rect x="160" y="578" width="10" height="10" rx="2" fill="#34d399"/><text x="176" y="587">execution / model-visible</text>
    <rect x="360" y="578" width="10" height="10" rx="2" fill="#a78bfa"/><text x="376" y="587">storage / analysis</text>
    <rect x="520" y="578" width="10" height="10" rx="2" fill="#fbbf24"/><text x="536" y="587">policy</text>
    <rect x="620" y="578" width="10" height="10" rx="2" fill="#fb7185"/><text x="636" y="587">observe-only hook path</text>
  </g>
</svg>
